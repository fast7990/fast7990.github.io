<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue2 Markdown转HTML示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            min-height: 600px;
        }
        
        .editor-panel, .preview-panel {
            padding: 30px;
            height: 100%;
        }
        
        .editor-panel {
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
        }
        
        .preview-panel {
            background: white;
        }
        
        .panel-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 20px;
            color: #495057;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .panel-title i {
            color: #4facfe;
        }
        
        textarea {
            width: 100%;
            height: 500px;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #4facfe;
        }
        
        .markdown-preview {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: white;
            line-height: 1.6;
        }
        
        .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 {
            color: #2c3e50;
            margin: 20px 0 10px 0;
        }
        
        .markdown-preview h1 {
            border-bottom: 2px solid #4facfe;
            padding-bottom: 10px;
        }
        
        .markdown-preview p {
            margin: 10px 0;
        }
        
        .markdown-preview code {
            background: #f1f3f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        
        .markdown-preview pre {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .markdown-preview blockquote {
            border-left: 4px solid #4facfe;
            padding-left: 15px;
            margin: 15px 0;
            color: #6c757d;
            background: #f8f9fa;
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }
        
        .markdown-preview table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .markdown-preview th, .markdown-preview td {
            border: 1px solid #dee2e6;
            padding: 8px 12px;
            text-align: left;
        }
        
        .markdown-preview th {
            background: #4facfe;
            color: white;
        }
        
        .footnotes {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e9ecef;
        }
        
        .footnotes h3 {
            color: #6c757d;
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        
        .footnotes ol {
            padding-left: 20px;
        }
        
        .footnotes li {
            margin: 5px 0;
            color: #6c757d;
        }
        
        .footnote-ref {
            vertical-align: super;
            font-size: 0.8em;
            color: #4facfe;
            text-decoration: none;
            margin: 0 2px;
        }
        
        .footnote-ref:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .editor-panel {
                border-right: none;
                border-bottom: 1px solid #e9ecef;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
